name: 'build-test'
on: # rebuild any PRs and main branch changes
  workflow_dispatch:

  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: |
          npm install
      - run: |
          npm run all

  smoke-test:
    needs: build
    if: github.event_name == 'pull_request'
    uses: Keeper-Security/ksm-tester/.github/workflows/ksm-action-smoke-test.yml@master
    with:
      ksm_action_ref: ${{ github.head_ref }}
    secrets: inherit
